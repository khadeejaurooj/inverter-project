allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}
// Local build fix: plugins that still declare an old compileSdk (e.g. 31) compile against an installed platform.
subprojects {
    if (!project.state.executed) {
        afterEvaluate { p ->
            if (p.hasProperty("android") && p.android.hasProperty("compileSdkVersion")) {
                p.android.compileSdkVersion 34
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
